site_name: Book Graph Analyzer Wiki
site_description: From zero to full lore-consistent story generation
repo_url: https://github.com/tflynn3/book-graph-analyzer
repo_name: tflynn3/book-graph-analyzer
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
plugins:
  - search
nav:
  - Home: index.md
  - Getting Started:
      - Getting Started: getting-started.md
      - Installation: installation.md
      - Quickstart: quickstart.md
  - Story Pipeline:
      - Architecture: ARCHITECTURE.md
      - Pipeline Walkthrough: pipeline.md
      - World-Building RFC: tolkien-worldbuilding-rfc.md
      - Story Generation: story-generation.md
      - Full End-to-End Example: end-to-end-example.md
      - Full Lifecycle Tutorial (Ingest -> Analyze -> Generate): full-lifecycle-tutorial.md
      - Examples: examples.md
  - Help:
      - Troubleshooting: troubleshooting.md
      - FAQ: faq.md
      - Glossary: glossary.md
  - Project:
      - Contributing: contributing.md
      - Legacy Design Docs: legacy-docs.md
